<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Object Souls</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/favicon.ico">
</head>
<body>
<div class="container" id="app">
  <div id="step-record">
    <h1>🎤</h1>
    <h2>물건의 이야기를 남겨주세요</h2>
    <p class="subtitle">이 물건이 왜 특별한가요? <br>다음 주인에게 당신의 목소리를 들려주세요.</p>

    <div class="form-group">
      <label>물건 이름 (선택사항)</label>
      <input type="text" id="item-title" placeholder="예: 빈티지 니콘 카메라" maxlength="100">
    </div>

    <div class="form-group">
      <label>당근 물건 ID (선택사항, QR 분실 시 복구용)</label>
      <input type="text" id="daangn-id" placeholder="당근 게시글의 ID를 입력하세요" maxlength="50">
    </div>

    <div class="recorder" id="recorder">
      <div class="timer" id="timer">0:00</div>
      <button class="btn btn-record" id="btn-record" onclick="toggleRecording()">
        <span class="icon">⏺</span>
        <span class="label" id="record-label">녹음 시작</span>
      </button>
    </div>

    <div id="preview-area" style="display:none;">
      <audio id="preview-audio" controls></audio>
      <button class="btn btn-primary" id="btn-submit" onclick="submitStory()">
        ✨ QR 코드 생성
      </button>
      <button class="btn btn-secondary" onclick="resetRecording()">
        🔄 다시 녹음
      </button>
    </div>

    <div id="loading" style="display:none;">
      <p>처리 중...</p>
    </div>
  </div>

  <div id="step-result" style="display:none;">
    <h2>✅ 이야기가 저장되었습니다!</h2>
    <p class="subtitle">QR 코드를 다운로드해서 당근 게시글에 추가하세요.</p>

    <div class="qr-result" id="qr-result"></div>
    <p class="qr-url" id="qr-url"></p>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="downloadQR()">📥 QR 다운로드</button>
      <button class="btn btn-secondary" onclick="copyLink()">🔗 링크 복사</button>
    </div>

    <div class="tip">
      <strong>💡 팁:</strong> QR 이미지를 핸드폰에도 저장하세요 — 직거래 시 상대방이 바로 스캔할 수 있습니다.
    </div>

    <button class="btn btn-secondary" onclick="resetAll()">➕ 다른 이야기 녹음하기</button>
  </div>

  <div id="step-error" style="display:none;">
    <h2>⚠️ 오류가 발생했습니다</h2>
    <p id="error-message"></p>
    <button class="btn btn-secondary" onclick="resetAll()">다시 시도</button>
  </div>
</div>

<footer class="footer">
  <p>Object Souls — 모든 물건에는 이야기가 있다.</p>
</footer>

<script>
let mediaRecorder = null;
let audioChunks = [];
let audioBlob = null;
let recordingTimer = null;
let seconds = 0;
let isRecording = false;
let qrSvgData = null;
let currentQrCodeId = null;

async function toggleRecording() {
  if (isRecording) { stopRecording(); return; }
  startRecording();
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream, {
      mimeType: MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4'
    });
    audioChunks = [];
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
      stream.getTracks().forEach(t => t.stop());
      document.getElementById('preview-area').style.display = 'block';
      document.getElementById('preview-audio').src = URL.createObjectURL(audioBlob);
      document.getElementById('btn-record').classList.remove('recording');
    };
    mediaRecorder.start();
    isRecording = true;
    document.getElementById('btn-record').classList.add('recording');
    document.getElementById('record-label').textContent = '녹음 중지';
    document.getElementById('btn-record').querySelector('.icon').textContent = '⏹';
    startTimer();
  } catch (err) {
    alert('마이크 접근 권한이 필요합니다. 브라우저 설정에서 마이크를 허용해주세요.');
    console.error(err);
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
    isRecording = false;
    document.getElementById('record-label').textContent = '✅ 녹음 완료';
    document.getElementById('btn-record').querySelector('.icon').textContent = '✅';
    stopTimer();
  }
}

function resetRecording() {
  audioBlob = null; audioChunks = [];
  document.getElementById('preview-area').style.display = 'none';
  document.getElementById('btn-record').classList.remove('recording');
  document.getElementById('record-label').textContent = '녹음 시작';
  document.getElementById('btn-record').querySelector('.icon').textContent = '⏺';
  seconds = 0; document.getElementById('timer').textContent = '0:00';
}

function startTimer() {
  seconds = 0; updateTimer();
  recordingTimer = setInterval(() => {
    seconds++;
    if (seconds >= 120) stopRecording();
    updateTimer();
  }, 1000);
}

function stopTimer() { if (recordingTimer) clearInterval(recordingTimer); recordingTimer = null; }

function updateTimer() {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2, '0')}`;
}

async function submitStory() {
  if (!audioBlob) return;
  const formData = new FormData();
  formData.append('title', document.getElementById('item-title').value.trim());
  formData.append('daangn_item_id', document.getElementById('daangn-id').value.trim());
  formData.append('voice_file', audioBlob, 'recording.webm');

  document.getElementById('loading').style.display = 'block';
  document.getElementById('btn-submit').disabled = true;

  try {
    const res = await fetch('/api/items', { method: 'POST', body: formData });
    const data = await res.json();
    qrSvgData = data.qr_svg;
    currentQrCodeId = data.qr_code_id;
    document.getElementById('step-record').style.display = 'none';
    document.getElementById('step-result').style.display = 'block';
    document.getElementById('qr-result').innerHTML = qrSvgData;
    document.getElementById('qr-url').textContent = window.location.origin + '/s/' + currentQrCodeId;
  } catch (err) {
    document.getElementById('step-record').style.display = 'none';
    document.getElementById('step-error').style.display = 'block';
    document.getElementById('error-message').textContent = '이야기 저장에 실패했습니다. 다시 시도해주세요.';
    console.error(err);
  } finally {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('btn-submit').disabled = false;
  }
}

function downloadQR() {
  const svg = document.getElementById('qr-result').innerHTML;
  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `object-souls-${(currentQrCodeId || 'qr').slice(0, 8)}.svg`;
  a.click();
  URL.revokeObjectURL(url);
}

async function copyLink() {
  const url = document.getElementById('qr-url').textContent;
  try { await navigator.clipboard.writeText(url); alert('링크가 복사되었습니다!'); }
  catch { prompt('이 링크를 복사하세요:', url); }
}

function resetAll() {
  document.getElementById('step-record').style.display = 'block';
  document.getElementById('step-result').style.display = 'none';
  document.getElementById('step-error').style.display = 'none';
  resetRecording();
  document.getElementById('item-title').value = '';
  document.getElementById('daangn-id').value = '';
}
</script>
</body>
</html>
