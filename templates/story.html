<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Object Souls</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/favicon.ico">
</head>
<body>
<div class="container" id="app">
  <div id="story-view" style="display:none;">
    <h1>📖</h1>
    <h2 id="item-title"></h2>
    <p class="subtitle" id="story-count-label"></p>

    <div class="story-chain" id="story-chain"></div>
    <hr>

    <h3>당신의 이야기를 남겨주세요</h3>
    <p class="subtitle">이 물건을 읽었나요? 가지고 있나요?<br>다음 사람에게 목소리 메시지를 남겨보세요.</p>

    <div class="recorder">
      <div class="timer" id="timer">0:00</div>
      <button class="btn btn-record" id="btn-record" onclick="toggleRecording()">
        <span class="icon">⏺</span>
        <span class="label" id="record-label">녹음 시작</span>
      </button>
    </div>

    <div id="preview-area" style="display:none;">
      <audio id="preview-audio" controls></audio>
      <div class="form-group">
        <label>이메일 (선택사항 — 다시 방문할 수 있는 링크를 보내드립니다)</label>
        <input type="email" id="email" placeholder="your@email.com" maxlength="200">
      </div>
      <button class="btn btn-primary" id="btn-add-story" onclick="addStory()">✨ 내 이야기 남기기</button>
      <button class="btn btn-secondary" onclick="resetRecording()">🔄 다시 녹음</button>
    </div>

    <div id="loading" style="display:none;"><p>이야기 추가 중...</p></div>
    <div id="success-area" style="display:none;">
      <h3>✅ 이야기가 추가되었습니다!</h3>
      <p>당신의 목소리가 이 물건의 여정에 함께합니다.</p>
    </div>
  </div>

  <div id="not-found-view" style="display:none;">
    <h1>🔍</h1>
    <h2>이야기를 찾을 수 없습니다</h2>
    <p class="subtitle">이 QR 코드와 일치하는 물건이 없습니다.</p>

    <div class="card">
      <h3>기존 물건의 QR을 다시 생성하셨나요?</h3>
      <p>당근 게시글 ID를 입력하면 기존 이야기를 찾을 수 있습니다:</p>
      <div class="form-group">
        <input type="text" id="reconnect-daangn-id" placeholder="당근 물건 ID" maxlength="50">
      </div>
      <button class="btn btn-primary" onclick="tryReconnect()">🔗 연결하기</button>
      <hr>
      <p>또는 <a href="/">새로운 이야기를 녹음</a>하세요.</p>
    </div>
    <div id="reconnect-result"></div>
  </div>
</div>

<footer class="footer">
  <p>Object Souls — 모든 물건에는 이야기가 있다.</p>
</footer>

<script>
var QR_CODE_ID = '{{ qr_code_id }}';
var ITEM_DATA = {{ items_json }};
var STORIES_DATA = {{ stories_json }};

var mediaRecorder = null;
var audioChunks = [];
var audioBlob = null;
var recordingTimer = null;
var seconds = 0;
var isRecording = false;

if (ITEM_DATA) {
  document.getElementById('story-view').style.display = 'block';
  var title = ITEM_DATA.title || '(이름 없는 물건)';
  document.getElementById('item-title').textContent = title;
  document.getElementById('story-count-label').textContent =
    '이 물건에 ' + STORIES_DATA.length + '개의 이야기가 담겨 있습니다';

  var chainEl = document.getElementById('story-chain');
  STORIES_DATA.forEach(function(story, i) {
    var card = document.createElement('div');
    card.className = 'story-card';
    card.innerHTML =
      '<div class="story-number">이야기 #' + (i + 1) + '</div>' +
      '<audio controls class="story-audio" src="/recordings/' + story.voice_filename + '"></audio>' +
      '<div class="story-meta">' +
        (story.created_at || '').slice(0, 10) + ' 기록됨' +
        (story.email ? ' · <span class="email-badge">💌 답장 가능</span>' : '') +
      '</div>';
    chainEl.appendChild(card);
  });
} else {
  document.getElementById('not-found-view').style.display = 'block';
}

async function toggleRecording() {
  if (isRecording) { stopRecording(); return; }
  startRecording();
}

async function startRecording() {
  try {
    var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream, {
      mimeType: MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4'
    });
    audioChunks = [];
    mediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = function() {
      audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
      stream.getTracks().forEach(function(t) { t.stop(); });
      document.getElementById('preview-area').style.display = 'block';
      document.getElementById('preview-audio').src = URL.createObjectURL(audioBlob);
      document.getElementById('btn-record').classList.remove('recording');
    };
    mediaRecorder.start();
    isRecording = true;
    document.getElementById('btn-record').classList.add('recording');
    document.getElementById('record-label').textContent = '녹음 중지';
    document.getElementById('btn-record').querySelector('.icon').textContent = '⏹';
    startTimer();
  } catch (err) {
    alert('마이크 접근 권한이 필요합니다.');
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
    isRecording = false;
    document.getElementById('record-label').textContent = '✅ 녹음 완료';
    document.getElementById('btn-record').querySelector('.icon').textContent = '✅';
    stopTimer();
  }
}

function resetRecording() {
  audioBlob = null; audioChunks = [];
  document.getElementById('preview-area').style.display = 'none';
  document.getElementById('btn-record').classList.remove('recording');
  document.getElementById('record-label').textContent = '녹음 시작';
  document.getElementById('btn-record').querySelector('.icon').textContent = '⏺';
  seconds = 0; document.getElementById('timer').textContent = '0:00';
}

function startTimer() {
  seconds = 0; updateTimer();
  recordingTimer = setInterval(function() {
    seconds++;
    if (seconds >= 120) stopRecording();
    updateTimer();
  }, 1000);
}

function stopTimer() { if (recordingTimer) clearInterval(recordingTimer); recordingTimer = null; }

function updateTimer() {
  var m = Math.floor(seconds / 60);
  var s = seconds % 60;
  document.getElementById('timer').textContent = m + ':' + s.toString().padStart(2, '0');
}

async function addStory() {
  if (!audioBlob) return;
  var formData = new FormData();
  formData.append('qr_code_id', QR_CODE_ID);
  const voiceExt = audioBlob.type.includes('mp4') ? 'mp4' : 'webm';
  formData.append('voice_file', audioBlob, 'story.' + voiceExt);
  formData.append('email', document.getElementById('email').value.trim());

  document.getElementById('loading').style.display = 'block';
  document.getElementById('btn-add-story').disabled = true;

  try {
    await fetch('/api/stories', { method: 'POST', body: formData });
    document.getElementById('preview-area').style.display = 'none';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('success-area').style.display = 'block';
  } catch (err) {
    alert('이야기 추가에 실패했습니다.');
    document.getElementById('loading').style.display = 'none';
    document.getElementById('btn-add-story').disabled = false;
  }
}

async function tryReconnect() {
  var daangnId = document.getElementById('reconnect-daangn-id').value.trim();
  if (!daangnId) { alert('당근 물건 ID를 입력하세요'); return; }

  var formData = new FormData();
  formData.append('daangn_item_id', daangnId);
  formData.append('old_qr_code_id', '');

  try {
    var res = await fetch('/api/qr/reconnect', { method: 'POST', body: formData });
    var data = await res.json();
    if (data.found) {
      document.getElementById('reconnect-result').innerHTML =
        '<div class="card"><h3>✅ 찾았습니다!</h3><p>이 물건에는 ' + data.story_count +
        '개의 이야기가 있습니다.</p><a href="' + data.story_url + '" class="btn btn-primary">이야기 보기</a></div>';
    } else {
      document.getElementById('reconnect-result').innerHTML =
        '<p style="color:#888;">찾을 수 없습니다. <a href="/">새로운 이야기를 녹음</a>하세요.</p>';
    }
  } catch (err) {
    alert('연결에 실패했습니다.');
  }
}
</script>
</body>
</html>
